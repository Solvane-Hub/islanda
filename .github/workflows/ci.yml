name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder values so the build can run without production secrets.
  # Real secrets are injected from GitHub Environments (Security Architecture).
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit and integration tests
        run: npm run test
      - name: Database migrations (isolated PGlite, no network database)
        run: npm run test:db
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # E2E covers the existing authenticated application flow. Production builds
    # default the public waitlist gate on, so explicitly exercise the
    # development/authenticated mode used by these tests. Sign-in behaviour
    # (e.g. wrong credentials must not enumerate accounts) is asserted against
    # the real Supabase project — a placeholder URL can only produce a
    # generic failure.
    env:
      WAITLIST_ONLY_MODE: 'false'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rls:
    name: Row Level Security (tenant isolation)
    runs-on: ubuntu-latest
    # Paused (risk A4): these suites sign in and write fixtures, some with the
    # service-role key, and the only hosted project is production. To resume,
    # set the repository variable HOSTED_DB_TESTS=enabled AND point the secrets
    # at a separate project named in HOSTED_DB_TEST_PROJECT_REF; the guard step
    # below refuses production and any undeclared project.
    if: ${{ vars.HOSTED_DB_TESTS == 'enabled' }}
    # Security control, not a feature. RLS_TESTS_REQUIRED=1 turns a missing
    # configuration into a failure rather than a silent skip.
    env:
      RLS_TESTS_REQUIRED: '1'
      # The suites that write waitlist signups skip against the production
      # project (tests/rls/client.ts); CI never enables production writes. Their
      # database-level assertions run on every push in `npm run test:db`
      # (isolated PGlite). Point SUPABASE_URL at a dedicated test project to run
      # them end to end through Auth and PostgREST.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Refuse production and undeclared databases
        run: npx tsx scripts/ci/assert-hosted-test-target.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          HOSTED_DB_TEST_PROJECT_REF: ${{ vars.HOSTED_DB_TEST_PROJECT_REF }}
      - name: Run RLS tests
        run: npm run test:rls
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RLS_TEST_USER_A_EMAIL: ${{ secrets.RLS_TEST_USER_A_EMAIL }}
          RLS_TEST_USER_A_PASSWORD: ${{ secrets.RLS_TEST_USER_A_PASSWORD }}
          RLS_TEST_USER_B_EMAIL: ${{ secrets.RLS_TEST_USER_B_EMAIL }}
          RLS_TEST_USER_B_PASSWORD: ${{ secrets.RLS_TEST_USER_B_PASSWORD }}
          # Used by the admin, business-evidence and business-intelligence suites
          # to seed fixtures and a throwaway user. Scoped to this step; no other
          # job or the app build receives it.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  a11y:
    name: Accessibility (WCAG 2.1 AA)
    runs-on: ubuntu-latest
    env:
      # The authenticated pages sign in as RLS test user A, which needs the real
      # Supabase project and the waitlist gate off (production builds default it
      # on, which redirects /login to the landing page).
      WAITLIST_ONLY_MODE: 'false'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Paused (risk A4): the authenticated pages sign in, so they get user A's
      # credentials only when hosted tests are enabled AND the guard has
      # confirmed a declared non-production project. Otherwise they skip and
      # only the public pages are checked.
      - name: Refuse production and undeclared databases
        if: ${{ vars.HOSTED_DB_TESTS == 'enabled' }}
        run: npx tsx scripts/ci/assert-hosted-test-target.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          HOSTED_DB_TEST_PROJECT_REF: ${{ vars.HOSTED_DB_TEST_PROJECT_REF }}
      - run: npm run test:a11y
        env:
          RLS_TEST_USER_A_EMAIL: ${{ vars.HOSTED_DB_TESTS == 'enabled' && secrets.RLS_TEST_USER_A_EMAIL || '' }}
          RLS_TEST_USER_A_PASSWORD: ${{ vars.HOSTED_DB_TESTS == 'enabled' && secrets.RLS_TEST_USER_A_PASSWORD || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: a11y-report
          path: playwright-report/
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Security Architecture — defense in depth. Fails on high/critical only,
      # so advisories in transitive dev dependencies don't block delivery.
      - run: npm audit --audit-level=high
