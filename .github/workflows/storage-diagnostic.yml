# TEMPORARY DIAGNOSTIC — delete together with
# scripts/diagnostics/storage-upload-diagnostic.mjs once the CI Storage upload
# failure in tests/rls/business-intelligence.test.ts:388 is understood.
#
# Isolated from ci.yml on purpose: it changes nothing about the real pipeline.
name: Storage upload diagnostic (temporary)

on:
  pull_request:
    paths:
      - scripts/diagnostics/storage-upload-diagnostic.mjs
      - .github/workflows/storage-diagnostic.yml

permissions:
  contents: read

jobs:
  probe:
    name: Storage probe (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is .nvmrc (what the RLS job uses); 24 matches the local machine
        # where every probe and the full RLS suite pass.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      - name: Upload probes (3 rounds)
        run: node scripts/diagnostics/storage-upload-diagnostic.mjs
        env:
          DIAG_ROUNDS: '3'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RLS_TEST_USER_A_EMAIL: ${{ secrets.RLS_TEST_USER_A_EMAIL }}
          RLS_TEST_USER_A_PASSWORD: ${{ secrets.RLS_TEST_USER_A_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # The unchanged failing test, alone — does it fail without the rest of
      # the RLS suite running in parallel?
      - name: Failing test in isolation (unchanged)
        if: always()
        run: >-
          npx vitest run --config vitest.rls.config.mts
          tests/rls/business-intelligence.test.ts
          -t "document storage is private and per-business"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RLS_TEST_USER_A_EMAIL: ${{ secrets.RLS_TEST_USER_A_EMAIL }}
          RLS_TEST_USER_A_PASSWORD: ${{ secrets.RLS_TEST_USER_A_PASSWORD }}
          RLS_TEST_USER_B_EMAIL: ${{ secrets.RLS_TEST_USER_B_EMAIL }}
          RLS_TEST_USER_B_PASSWORD: ${{ secrets.RLS_TEST_USER_B_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
